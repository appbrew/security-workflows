# Organization rulesets の「Require workflows to pass before merging」から全リポジトリに課す。
# PR で増えたコミットだけを検査する。全履歴を毎回検査すると、過去に混入したものですべての PR が落ちるため。
name: Betterleaks

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: betterleaks-${{ github.event.pull_request.number || github.ref }}

env:
  BETTERLEAKS_VERSION: 1.9.0
  # https://github.com/betterleaks/betterleaks/releases/download/v1.9.0/checksums.txt
  BETTERLEAKS_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7

jobs:
  scan:
    if: true
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Betterleaks
        run: |
          archive="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/${archive}"
          echo "${BETTERLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" betterleaks

      # 設定は検査される側の .betterleaks.toml ではなく、ここで固定する。
      # PR が自分の検査ルールを弱められないようにするため。
      # 個別の除外は、PR のレビューに載る .betterleaksignore で行う。
      - name: Write config
        run: |
          cat > "$RUNNER_TEMP/betterleaks.toml" <<'EOF'
          [extend]
          useDefault = true
          EOF

      # --validation は付けない。見つけた値を外部の API に送ってしまうため。
      - name: Scan commits added by this change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          "$RUNNER_TEMP/betterleaks" git . \
            --config "$RUNNER_TEMP/betterleaks.toml" \
            --log-opts "${BASE_SHA}..${HEAD_SHA}" \
            --platform github \
            --redact \
            --verbose
